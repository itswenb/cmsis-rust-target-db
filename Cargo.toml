[package]
name = "cmsis-rust-target-db"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Generate a Rust target database from CMSIS-Pack PDSC device metadata"
repository = "https://github.com/itswenb/cmsis-rust-target-db"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
